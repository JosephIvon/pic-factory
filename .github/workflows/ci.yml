# ============================================================================
# 医美图文流水线 CI 门禁（外部审计 CI 三项：pytest / docker build / 离线 replay 冒烟，外加密钥泄漏扫描）
#
# ⚠️ 如实声明（写在本文件第一屏）：
#   1) 状态订正（开源面首发之后）：本文件已随开源面（public 单提交）推到 GitHub 并**真实
#      触发**；master 自身只有 local / upstream 镜像，在 master 上本 workflow 仍不会触发，
#      门禁跑的是开源面。三条 job 的本地等价命令见 tools/ci_local.sh。
#      首跑实测（ubuntu-latest / py3.11，run 40091556518）：docker build ✅、replay-smoke ✅、
#      test job ❌（GitHub 逐条日志要登录才能看，本机用 python:3.11 容器复现）。复现查出
#      两类 Linux 专属问题，都已修：
#        a) tests/test_cache.py 的"绝对路径"用例写死 `C:/tmp/legacy.png`——Windows 上它是
#           绝对路径，POSIX 上是**相对**路径（被锚回仓库根），同一断言在两种系统含义相反
#           （容器复现口径 1 failed / 173 passed）。已改用 tmp_path 取当前平台绝对路径。
#        b) 裸 Linux 无 libGL 时 `import rapidocr_onnxruntime` 直接 ImportError，
#           test job 再红 2 项、且 replay-smoke 退化成"文字闸没跑但 exit 0"的假绿
#           （容器复现：不装 libgl1 → 2 failed / 172 passed；装了的口径见下）。
#           已在两条 job 显式装 libgl1（与 Dockerfile 同口径），并给冒烟加"文字闸必须真的
#           执行过"的断言。
#      教训入账：本机全绿 ≠ CI 全绿；路径语法与环境依赖类断言必须写成平台中立。
#   2) 密钥扫描说明：审计给的原始口径 `grep -rE "ark-[A-Za-z0-9]{6,}|sk-ws-..."` 会在
#      HEAD 上**误报**——tests/test_adversarial.py:299 的假 node_id（形如 `req-` 前缀拼
#      六个以上字母的测试常量）被 `ark-` 分支命中。不允许改测试，所以这里改用 PCRE
#      负向后顾 `(?<![\w-])`：真实密钥（ark- / sk-ws- 出现在 空格/=/引号/行首 之后）
#      照样全中，前邻为 - 或单词字符的代码内碎片不再误杀。
#      已在开发机验证：本模式对当前仓库扫描无命中（clean）。
#
# face 测试在 CI 裸环境的行为（按 tests/test_qc_face.py 与 src/aesthetics_pipeline/qc/face.py 实测核对）：
#   - tests/test_qc_face.py **从不触发 buffalo_l 权重下载**：会真正触碰模型的两个用例
#     （test_similarity… / test_detect_converts_to_bgr…）都用 monkeypatch 注入假
#     _detect / _face_app，其余是纯逻辑断言（阶段化阈值、选脸规则、标定文案）。
#     所以 test job 不需要权重缓存/下载步骤，pytest 全程离线可过。
#   - qc/face.py._face_app() 的兜底：insightface 缺失 / 权重不可用 → 捕获 Exception →
#     闸门返回 skipped（不伪造通过分数）。
#     **口径（2026-10-24 复审后改）：skipped = 闸门没跑成 = 不能记为合格。**
#     与 OCR 闸「文字闸未执行，不能记为合格」同口径——之前这里放行，
#     等于把没验过身份的图标成合格出厂。质检阶段：人物任务拒收；
#     出厂复检阶段（换脸后）：一律拒收。生成阶段仍只标记漂移、不拦。
#   - replay-smoke job 据此**故意不装 insightface**（只装 core + rapidocr-onnxruntime）：
#     人脸闸走上述 skipped 路径 → **人物任务一律拒收**（matrix 夹具 4 条全是
#     character=lin），OCR 文字闸正常执行（rapidocr 的 onnx 权重随 pip 包分发），
#     全链严格离线。开发机已用"屏蔽 insightface 导入"的方式模拟该环境实跑：三命令 exit 0，
#     4 条全部 rejected（理由=人脸闸未执行，不能记为合格）——见下面那条正向断言。
# ============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest（全量回归）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 密钥泄漏扫描
        run: |
          grep -rPn "(?<![\w-])(ark-[A-Za-z0-9]{6,}|sk-ws-[A-Za-z0-9]{6,})" \
            --exclude-dir=.git --exclude-dir=node_modules . && exit 1 || echo clean

      - uses: actions/setup-python@v5
        with:
          # pyproject requires-python = ">=3.11" → 取下界 3.11
          # （注意 Dockerfile 用的是 python:3.12-slim，两条线版本不同是有意口径）
          python-version: "3.11"
          cache: pip

      - name: 装 GL 运行库（cv2 的 libGL，缺了 OCR/人脸闸直接 ImportError）
        # 实测（python:3.11 裸容器）：不装 libgl1 时 `import rapidocr_onnxruntime` 报
        # `libGL.so.1: cannot open shared object file`，tests/test_qc_rules.py 两个用例
        # （test_ocr_detects_text_when_ocr_available / test_engine_present_marks_ocr_available）
        # 红。开发机是 Windows，DLL 自带，所以本机全绿看不出来。与 Dockerfile 同一口径。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0

      - name: 安装（含 qc/panel 与 dev=pytest）
        # 审计口径是 `pip install -e ".[qc,panel]"`；本仓库 dev extra 才有 pytest，
        # 故并入 ".[qc,panel,dev]"，其余零改动。
        run: pip install -e ".[qc,panel,dev]"

      - name: pytest -q
        run: pytest -q

      - name: README 测试数量防漂移
        # README 三处声明的数量若与 pytest --collect-only 实际值不一致则退出码 1
        run: python tools/check_readme_test_count.py

      - name: 文档数字防漂移（MODEL-CHOICE / DOMAIN-PACKS / 在场文档 vs 代码与证据文件）
        # 38 项实算：任务矩阵条数、路由分布、夹具条数与可回放路线、人脸阈值与标定样本数、
        # 预算熔断比例、并发钳位、各环境变量默认值、选型口径五行（生产度量复算 JSON）……
        # 文档里的数字只要和代码/证据文件对不上就退出码 1。
        # --public：本仓发布树没有内部版 README/DEMO，目标文档不在场的检查项跳过（跳过项可见）。
        run: python tools/check_doc_numbers.py --public

  docker:
    name: docker build（只 build 不起容器）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 密钥泄漏扫描
        run: |
          grep -rPn "(?<![\w-])(ark-[A-Za-z0-9]{6,}|sk-ws-[A-Za-z0-9]{6,})" \
            --exclude-dir=.git --exclude-dir=node_modules . && exit 1 || echo clean

      - name: docker build .
        run: docker build .

  replay-smoke:
    name: 离线 replay 冒烟（generate → qc → report）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 密钥泄漏扫描
        run: |
          grep -rPn "(?<![\w-])(ark-[A-Za-z0-9]{6,}|sk-ws-[A-Za-z0-9]{6,})" \
            --exclude-dir=.git --exclude-dir=node_modules . && exit 1 || echo clean

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装 GL 运行库（rapidocr→cv2 需要 libGL）
        # 实测（python:3.11 裸容器，2026-10-24）：只 pip 装 rapidocr-onnxruntime 而不装
        # libgl1 时，OCR 引擎加载失败 → rules.py 把 4 条全判"OCR 引擎不可用：文字闸未执行"，
        # 冒烟 exit 0 却是**假绿**（正是下面那条断言要防的）。装了 libgl1 后文字闸真的跑：
        # 4 条里 3 accepted / 1 rejected，拒收原因是实拍到的画面内文字「®」。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0

      - name: 安装（core + rapidocr；故意不装 insightface，保持严格离线）
        # insightface 进了包，qc 会尝试联网拉 buffalo_l 权重 → 与"离线冒烟"矛盾；
        # 不装它则 face.py 走 skipped 兜底（见本文件顶部注释）。rapidocr-onnxruntime
        # 必装：缺 OCR 时 rules.py 会把每条判"OCR 引擎不可用：文字闸未执行，不能记为合格"
        # （exit 0 但全拦，冒烟退化成假绿），装上且 GL 库齐，文字闸才真的在跑。
        run: |
          pip install -e .
          pip install "rapidocr-onnxruntime"

      # 命令与参数逐条对着 src/aesthetics_pipeline/cli.py 核实过：
      #   generate --provider replay（provider 选项默认 matrix，replay 需在枚举里显式选）
      #            --replay-provider matrix（对应 typer 的 --replay-provider 旗标）
      #            --db <path> --limit N    ——均真实存在；
      #   ReplayProvider 的缓存搜索序：out/cache →（fresh clone 无）→ REPO_ROOT/fixtures/cache
      #   （fixtures/cache/matrix/*.json 共 4 条，local_path 指向随仓库提交的
      #    fixtures/images/，fresh clone 离线可解析）——limit 4 恰好全部命中回放缓存。
      - name: replay 生成（独立台账，不碰 data/pipeline.db）
        run: aesthetics generate --provider replay --replay-provider matrix --db /tmp/ci.db --limit 4

      - name: 质检（人脸闸未执行 → 人物任务必须拒收；OCR 闸真实执行）
        run: aesthetics qc --db /tmp/ci.db

      - name: 出报表（拼图 + CSV + JSON）
        run: aesthetics report --db /tmp/ci.db

      - name: 台账落账核验（4 条 replay 行、判定写回、且文字闸真的跑过、人脸闸 fail-closed）
        run: |
          python - <<'EOF'
          import sqlite3
          conn = sqlite3.connect("/tmp/ci.db")
          rows = conn.execute(
              "SELECT idempotency_key, character, qc_verdict, qc_reasons FROM assets WHERE provider='matrix'"
          ).fetchall()
          assert len(rows) == 4, f"期望 4 条回放落账，实际 {len(rows)}: {rows}"
          assert all(v in ("accepted", "rejected") for _, _, v, _ in rows), rows
          # 假绿防线：OCR 引擎加载不到时 rules.py 会给每条挂"OCR 引擎不可用"并一律拦下，
          # 判定依然写回、exit 依然 0——冒烟就退化成"什么都没验"。这里要求文字闸真的执行。
          no_ocr = [k for k, _, _, r in rows if r and "OCR 引擎不可用" in r]
          assert not no_ocr, f"文字闸未执行（rapidocr/cv2 加载失败，多半缺 libGL）：{no_ocr}"
          # 假绿防线（人脸闸 fail-closed）：本 job 故意不装 insightface，所以人物任务的
          # 人脸闸**没跑成**。这时**必须**拒收——「闸门没跑 ≠ 合格」。矩阵夹具 4 条
          # 全是人物任务（character=lin），所以 4 条都该命中这条理由、且一条都不能是 accepted。
          for key, character, verdict, reasons in rows:
              if character:
                  assert verdict == "rejected", f"人物任务在人脸闸未执行时必须拒收: {(key, verdict, reasons)}"
                  assert "人脸闸未执行" in (reasons or ""), f"拒收理由要写明闸门没跑: {(key, reasons)}"
          print("replay-smoke 台账核验 OK（文字闸已执行；人脸闸未执行 → 人物任务已拒收）:",
                [(k, v) for k, _, v, _ in rows])
          EOF

# ============================================================================
# 开发机等价实跑记录（2026-10-24，Git Bash + 项目 venv，PYTHONPATH 指向仓内 src；
# insightface 用假模块屏蔽以模拟本 job 环境）：
#   generate --provider replay --replay-provider matrix --db /tmp/ci.db --limit 4  → exit 0（replay 4/4 成功）
#   qc --db /tmp/ci.db                                                             → exit 0（4 条**拒收**：人脸闸未执行 → fail-closed；OCR 在跑）
#   report --db /tmp/ci.db                                                         → exit 0（0 合格/4 拒收，contact_sheet.png 落 out/report/）
# 完整输出见交付报告；本地复现直接跑 tools/ci_local.sh smoke。
# ============================================================================

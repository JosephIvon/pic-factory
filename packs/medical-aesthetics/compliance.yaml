# 合规要求（域包级）
#
# 这些不是"文档里的口号"，是域包的一部分：报告/发布包/质检接线时按字段读取。
# 医美是持牌医疗行为，所以这里的约束比通用内容行业严格。

# 每条文案末尾必须带上的免责声明（发布包会校验存在性）
# 注意：措辞里**不能出现禁用词表里的词**（例如"疗效承诺"里的"承诺"会被文案闸命中），
# 否则合规声明本身会被自己的闸门拦下——这是实测踩过的坑。
required_disclaimer: "本内容为 AI 生成演示素材，不构成医疗建议；具体方案以持证医师面诊为准。"

# AI 生成内容标识（《人工智能生成合成内容标识办法》）
ai_label:
  explicit: true            # 画面内显式标识（平台水印 / 角标）
  implicit_metadata: true   # 文件元数据隐式标识（发布包写入 manifest.json）

# 禁止出现的构图/题材（人工复核 checklist，不进自动闸门）
forbidden_motifs:
  - "术前术后对比构图"
  - "患者形象作疗效证明"
  - "真实机构名称与门头特写"
  - "医生姓名、职称、执业证号"

# 文案与画面的分工（自动闸门据此判断"画面里不该有中文"）
text_policy: "中文只允许出现在后处理合成的排版层，画面层 prompt 禁止中文"

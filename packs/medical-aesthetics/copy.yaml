# 文案层：模板 + 禁用词表（域包版）
#
# 模板里的占位符只允许：{city} {project} {copy_angle} {channel} {theme}
# 未知占位符会在加载时报错（宁可在配置期炸，也不要在出文案时静默少字）。

templates:
  xiaohongshu:
    title: "{city}{project}｜{copy_angle}"
    body: |
      📍{city}
      项目：{project}
      内容角度：{copy_angle}

      本条记录的是一次真实就诊场景的画面，画面为演示用生成素材，不代表任何机构的真实顾客。
      具体方案、适应症与禁忌请以面诊结论为准。
      本内容为 AI 生成演示素材，不构成医疗建议；具体方案以持证医师面诊为准。
    tags: ["#{city}医美", "#{project}", "#{copy_angle}", "#医美记录"]

  default:
    title: "{city}{project}：{copy_angle}"
    body: |
      在城市：{city}
      项目：{project}
      角度：{copy_angle}

      本条为演示用生成素材，用于展示内容生产流程，不构成医疗建议。实际适应症、禁忌与方案请以持证医师面诊为准。
      本内容为 AI 生成演示素材，不构成医疗建议；具体方案以持证医师面诊为准。
    tags: ["{city}", "{project}", "{copy_angle}"]

# 禁用词表：每条 (词, 归类)。来源见 docs/DOMAIN-PACKS.md，正式上线前需法务确认。
banned_words:
  # 绝对化用语（《广告法》第九条）
  - ["国家级", "绝对化用语"]
  - ["最高级", "绝对化用语"]
  - ["最佳", "绝对化用语"]
  - ["最好", "绝对化用语"]
  - ["第一", "绝对化用语"]
  - ["顶级", "绝对化用语"]
  - ["唯一", "绝对化用语"]
  - ["全网最", "绝对化用语"]
  - ["史上最", "绝对化用语"]
  - ["无与伦比", "绝对化用语"]
  # 疗效承诺
  - ["保证", "疗效承诺"]
  - ["承诺", "疗效承诺"]
  - ["永久", "疗效承诺"]
  - ["根治", "疗效承诺"]
  - ["彻底治愈", "疗效承诺"]
  - ["无效退款", "疗效承诺"]
  - ["零风险", "疗效承诺"]
  - ["无风险", "疗效承诺"]
  - ["包满意", "疗效承诺"]
  - ["包效果", "疗效承诺"]
  - ["绝对安全", "疗效承诺"]
  # 效果断言（医疗广告禁止）
  - ["治愈率", "效果断言"]
  - ["有效率", "效果断言"]
  - ["成功率", "效果断言"]
  - ["疗效显著", "效果断言"]
  - ["立刻见效", "效果断言"]
  - ["立即见效", "效果断言"]
  - ["立竿见影", "效果断言"]
  - ["一次见效", "效果断言"]
  # 价格诱导
  - ["全网最低", "价格诱导"]
  - ["最低价", "价格诱导"]
  - ["免费送", "价格诱导"]
  - ["限时秒杀", "价格诱导"]
  - ["最后一天", "价格诱导"]
  # 医疗术语外用
  - ["处方", "医疗用语"]
  - ["药到病除", "医疗用语"]
  - ["细胞再生", "医疗用语"]

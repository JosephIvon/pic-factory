<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>医美 AI 图文闭环 · 控制台</title>
<!--
  零 CDN 依赖：断网环境下页面必须照样能开。
  零构建步骤：一个文件就是全部前端。
-->
<style>
  :root {
    --bg: #14141a; --panel: #1d1d25; --line: #2c2c37;
    --fg: #e8e8ec; --dim: #9494a4; --accent: #5aa9ff;
    --ok: #46c98b; --bad: #f0656f; --warn: #e8b64c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .stats b { color: var(--fg); font-weight: 600; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 20px 60px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  section h2 { font-size: 13px; margin: 0 0 10px; color: var(--dim); font-weight: 600; letter-spacing: .04em; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 3px; }
  select, input[type=number], input[type=text] {
    width: 100%; padding: 6px 8px; background: #111119; color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; font-size: 13px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 5px;
    background: var(--accent); color: #06203a; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 400; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .muted { color: var(--dim); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; border: 1px solid var(--line); }
  .tag.matrix { color: var(--accent); border-color: #2b4d75; }
  .tag.local { color: var(--warn); border-color: #6b5626; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; cursor: pointer; background: #111119; }
  .card:hover { border-color: var(--accent); }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #000; }
  .card .cap { padding: 7px 8px; font-size: 12px; }
  .card .cap div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 11px; padding: 0 5px; border-radius: 3px; }
  .pill.accepted { color: var(--ok); border: 1px solid #2c5c44; }
  .pill.rejected { color: var(--bad); border: 1px solid #6b2c31; }
  .pill.pending { color: var(--dim); border: 1px solid var(--line); }
  .pill.adopt-yes { color: var(--ok); border: 1px solid #2c5c44; }
  .pill.adopt-no { color: var(--bad); border: 1px solid #6b2c31; }
  .adopt-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  button.mini { width: auto; margin: 0; padding: 2px 12px; font-size: 12px; font-weight: 400;
                background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; }
  button.mini:hover { color: var(--fg); border-color: var(--dim); }
  button.mini.yes.on { color: var(--ok); border-color: #2c5c44; }
  button.mini.no.on { color: var(--bad); border-color: #6b2c31; }
  pre { background: #0e0e14; border: 1px solid var(--line); border-radius: 5px; padding: 9px;
        max-height: 220px; overflow: auto; font-size: 11px; white-space: pre-wrap; word-break: break-all; color: var(--dim); }
  #drawer { position: fixed; inset: 0; background: rgba(8,8,12,.82); display: none; padding: 24px; overflow: auto; }
  #drawer.open { display: block; }
  #drawer .box { max-width: 1080px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line);
                 border-radius: 8px; padding: 18px; display: grid; grid-template-columns: 380px 1fr; gap: 18px; }
  @media (max-width: 860px) { #drawer .box { grid-template-columns: 1fr; } }
  #drawer img { width: 100%; border-radius: 6px; background: #000; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 13px; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; word-break: break-word; }
  .close { position: sticky; top: 0; float: right; }
</style>
</head>
<body>
<header>
  <h1>医美 AI 图文闭环 · 控制台</h1>
  <div class="stats" id="stats">载入中…</div>
</header>

<main>
  <div>
    <section>
      <h2>提交任务</h2>
      <label>城市</label><select id="city"></select>
      <label>项目</label><select id="project"></select>
      <label>主题</label><select id="theme"></select>
      <div class="row">
        <div><label>后端</label>
          <select id="provider">
            <option value="auto">auto（按规则表自动分流）</option>
            <option value="matrix">matrix（API）</option>
            <option value="local">local（本地栈）</option>
          </select>
        </div>
        <div><label>张数</label><input type="number" id="limit" value="4" min="1" max="50" /></div>
      </div>
      <label class="check"><input type="checkbox" id="chain" checked />
        生成后自动质检 → 换脸兜底 → 出报表（出厂判定在换脸之后）</label>
      <button id="submit">提交任务</button>
      <button class="ghost" id="planBtn">预览路由</button>
      <div id="planBox"></div>
    </section>

    <section>
      <h2>成本账 · 单张合格图综合成本 = 总花费 ÷ 合格张数</h2>
      <div id="costBox"></div>
    </section>

    <section>
      <h2>任务日志</h2>
      <pre id="log">（还没有任务）</pre>
    </section>
  </div>

  <div>
    <section>
      <h2>画廊 · 点开看质检明细 / 路由理由 / 成本</h2>
      <div class="gallery" id="gallery"></div>
    </section>
  </div>
</main>

<div id="drawer" onclick="if(event.target===this)closeDrawer()">
  <div class="box">
    <div>
      <button class="ghost close" onclick="closeDrawer()">关闭</button>
      <img id="dImg" alt="产出预览" />
    </div>
    <div>
      <h2 style="color:var(--fg);font-size:15px" id="dTitle">—</h2>
      <dl class="kv" id="dKv"></dl>
      <h2 style="margin-top:14px">抽检台 · 人工采纳（写走 CLI 子进程）</h2>
      <div id="dAdopt"><span class="muted">—</span></div>
      <h2 style="margin-top:14px">质检明细</h2>
      <div id="dQc"></div>
      <h2 style="margin-top:14px">路由理由</h2>
      <div id="dRoute"></div>
      <h2 style="margin-top:14px">画面 prompt</h2>
      <pre id="dPrompt"></pre>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const yuan = (v) => (v == null ? "—" : "¥" + Number(v).toFixed(4));
const VERDICT = { accepted: "放行", rejected: "拦截", pending: "待检" };
const ADOPT_CN = { adopted: "已采纳", rejected: "已弃用" };
let CURRENT = null; // 抽屉里当前打开的资产 {key, provider}，采纳后回刷明细用

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}

async function loadMeta() {
  const m = await api("/api/meta");
  const fill = (id, list, all) => {
    $(id).innerHTML =
      `<option value="">${all}</option>` + list.map((v) => `<option>${esc(v)}</option>`).join("");
  };
  fill("city", m.cities, "全部城市");
  fill("project", m.projects, "全部项目");
  fill("theme", m.themes, "全部主题");
  const b = m.backends || {};
  const note = Object.entries(b).map(([k, v]) =>
    `${k} ${v.available ? "可用" : "不可用"}`).join(" · ");
  $("stats").innerHTML =
    `<span>任务矩阵 <b>${m.total_specs}</b> 条</span><span>后端 <b>${esc(note)}</b></span>` +
    `<span>单价 <b>${m.cost_configured ? "已配置" : "未配置（不编造金额）"}</b></span>`;
}

async function refresh() {
  const [sum, cost] = await Promise.all([api("/api/summary"), api("/api/cost")]);
  const ad = sum.adoption || {};
  $("stats").innerHTML =
    `<span>产出 <b>${sum.assets}</b></span><span>放行 <b class="ok">${sum.accepted}</b></span>` +
    `<span>拦截 <b class="bad">${sum.rejected}</b></span><span>待检 <b>${sum.pending}</b></span>` +
    `<span>采纳率 <b>${ad.adoption_rate == null ? "—" : (ad.adoption_rate * 100).toFixed(1) + "%"}</b>` +
    `（采纳 ${ad.adopted || 0} / 产出 ${ad.generated || 0}，弃用 ${ad.rejected || 0}）</span>` +
    `<span>总耗时 <b>${sum.gen_seconds_total}s</b></span>` +
    `<span>已配单价张数 <b>${sum.priced_assets}</b></span>`;

  const rows = cost.items || [];
  $("costBox").innerHTML = rows.length
    ? `<table><tr><th>后端</th><th>调用</th><th>合格</th><th>通过率</th><th>单张合格图综合成本</th></tr>` +
      rows.map((c) => `<tr>
        <td><span class="tag ${esc(c.provider)}">${esc(c.provider)}</span></td>
        <td>${c.calls}</td><td>${c.accepted}</td>
        <td>${c.accept_rate == null ? "—" : (c.accept_rate * 100).toFixed(1) + "%"}</td>
        <td>${c.priced ? yuan(c.cost_per_accepted) : '<span class="muted">未配置单价</span>'}</td>
      </tr>`).join("") + `</table>`
    : `<span class="muted">台账还是空的</span>`;

  const a = await api("/api/assets");
  $("gallery").innerHTML = (a.items || []).map((it) => `
    <div class="card" onclick='showDetail(${JSON.stringify(it.key)}, ${JSON.stringify(it.provider)})'>
      ${it.image ? `<img src="${esc(it.image)}" loading="lazy" />` : `<div style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center" class="muted">无图</div>`}
      <div class="cap">
        <div><b>${esc(it.city)}</b> · ${esc(it.project)}</div>
        <div class="muted">${esc(it.theme)}</div>
        <div style="margin-top:4px">
          <span class="tag ${esc(it.provider)}">${esc(it.provider)}</span>
          <span class="pill ${esc(it.verdict)}">${VERDICT[it.verdict] || esc(it.verdict)}</span>
          ${it.swapped ? '<span class="muted">已换脸</span>' : ""}
        </div>
        <div class="muted mono">${esc(it.rule_id || "-")} · ${it.est_cost == null ? "未定价" : yuan(it.est_cost)}</div>
        <div class="adopt-row">
          <button class="mini yes ${it.adopted === "adopted" ? "on" : ""}" title="抽检台：用这张"
            data-key="${esc(it.key)}" data-provider="${esc(it.provider)}" data-decision="adopted"
            onclick="event.stopPropagation();quickAdopt(this)">用</button>
          <button class="mini no ${it.adopted === "rejected" ? "on" : ""}" title="抽检台：不用这张"
            data-key="${esc(it.key)}" data-provider="${esc(it.provider)}" data-decision="rejected"
            onclick="event.stopPropagation();quickAdopt(this)">不用</button>
          ${it.adopted
            ? `<span class="pill ${it.adopted === "adopted" ? "adopt-yes" : "adopt-no"}">${ADOPT_CN[it.adopted]}</span>`
            : `<span class="muted" style="font-size:11px">未抽检</span>`}
        </div>
      </div>
    </div>`).join("") || `<span class="muted">还没有产出，先提交一批任务。</span>`;
}

async function showDetail(key, provider) {
  CURRENT = { key, provider };
  const { asset } = await api(`/api/assets/${encodeURIComponent(key)}?provider=${encodeURIComponent(provider)}`);
  $("dTitle").textContent = `${asset.city} · ${asset.project} · ${asset.theme}`;
  $("dImg").src = asset.image || "";
  const kv = [
    ["后端", asset.provider + (asset.route ? `（${asset.route}）` : "")],
    ["判定", VERDICT[asset.verdict] || asset.verdict],
    ["人工采纳", asset.adopted ? `${ADOPT_CN[asset.adopted]} · ${asset.adopted_at || ""}` : "未抽检"],
    ["命中规则", asset.rule_id || "-"],
    ["身份分", asset.face_similarity == null ? "-" : asset.face_similarity +
        (asset.face_similarity_after == null ? "（换脸前）" : ` → ${asset.face_similarity_after}（换脸后）`)],
    ["耗时", asset.gen_seconds == null ? "-" : asset.gen_seconds + "s"],
    ["单张成本", yuan(asset.est_cost)],
    ["按当前单价现算", yuan(asset.unit_cost)],
    ["产出文件", asset.file_name || "-"],
    ["产出时间", asset.created_at || "-"],
  ];
  $("dKv").innerHTML = kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");

  const r = asset.reasons || [];
  const rules = asset.qc_rules || {};
  const ruleRows = Object.entries(rules).filter(([k]) => k !== "face");
  $("dQc").innerHTML =
    (r.length ? `<ul>${r.map((x) => `<li class="bad">${esc(x)}</li>`).join("")}</ul>` : `<span class="ok">无拦截理由</span>`) +
    (ruleRows.length ? `<table style="margin-top:6px">${ruleRows.map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td class="mono">${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("")}</table>` : "") +
    ((asset.text_found || []).length ? `<div class="bad" style="margin-top:6px">画面内文字：${esc(asset.text_found.join("、"))}</div>` : "");

  $("dRoute").innerHTML =
    `<div><span class="tag ${esc(asset.provider)}">${esc(asset.provider)}</span> <b>${esc(asset.rule_id || "-")}</b></div>` +
    `<div class="muted" style="margin-top:4px">${esc(asset.rule_reason || "（台账里没有路由理由：这一行不是自动路由产生的）")}</div>`;
  $("dPrompt").textContent = asset.prompt || "-";
  $("dAdopt").innerHTML = `
    <div class="muted">当前：${asset.adopted
      ? `${ADOPT_CN[asset.adopted]}${asset.adopted_at ? "（" + esc(asset.adopted_at) + "）" : ""}`
      : "未处理"}${asset.adopt_note ? `<br>备注：${esc(asset.adopt_note)}` : ""}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="mini yes ${asset.adopted === "adopted" ? "on" : ""}"
        onclick="adoptFromDrawer('adopted')">用</button>
      <button class="mini no ${asset.adopted === "rejected" ? "on" : ""}"
        onclick="adoptFromDrawer('rejected')">不用</button>
    </div>
    <input type="text" id="dNote" placeholder="备注（不用：为何不采用，可留空）" style="margin-top:8px" />`;
  $("drawer").classList.add("open");
}
function closeDrawer() { $("drawer").classList.remove("open"); }

// 采纳/弃用：POST /api/assets/adopt → 面板拼 CLI adopt 子命令走子进程写台账。
async function postAdopt(key, provider, decision, note) {
  try {
    await api("/api/assets/adopt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, provider, decision, note: note || "" }),
    });
    await refresh();
    return true;
  } catch (e) {
    alert("采纳写入失败：" + e.message);
    return false;
  }
}

async function quickAdopt(btn) {
  let note = "";
  if (btn.dataset.decision === "rejected") {
    note = prompt("不用原因（记入台账，可留空）") || "";
  }
  const ok = await postAdopt(btn.dataset.key, btn.dataset.provider, btn.dataset.decision, note);
  // 抽屉正开着同一张时同步刷新明细，避免看到旧状态
  if (ok && $("drawer").classList.contains("open") && CURRENT && CURRENT.key === btn.dataset.key) {
    await showDetail(CURRENT.key, CURRENT.provider);
  }
}

async function adoptFromDrawer(decision) {
  if (!CURRENT) return;
  const note = $("dNote") ? $("dNote").value.trim() : "";
  if (await postAdopt(CURRENT.key, CURRENT.provider, decision, note)) {
    await showDetail(CURRENT.key, CURRENT.provider);
  }
}

async function showPlan() {
  const q = new URLSearchParams();
  ["city", "project", "theme"].forEach((k) => { if ($(k).value) q.set(k, $(k).value); });
  const p = await api("/api/plan?" + q.toString());
  if (p.error) { $("planBox").innerHTML = `<div class="bad" style="margin-top:8px">${esc(p.error)}</div>`; return; }
  const s = p.summary || {};
  const head = Object.entries(s).map(([k, v]) =>
    `${esc(k)} ${v.count} 条（${Object.entries(v.rules).map(([r, n]) => esc(r) + "×" + n).join("、")}）`).join(" · ");
  $("planBox").innerHTML =
    `<div class="muted" style="margin-top:10px">命中：${esc(head)}</div>` +
    `<table style="margin-top:6px"><tr><th>项目</th><th>主题</th><th>后端</th><th>规则</th></tr>` +
    (p.items || []).slice(0, 12).map((it) => `<tr>
      <td>${esc(it.project)}</td><td>${esc(it.theme)}</td>
      <td><span class="tag ${esc(it.provider)}">${esc(it.provider)}</span></td>
      <td class="mono" title="${esc(it.reason)}">${esc(it.rule_id)}</td></tr>`).join("") +
    `</table>`;
}

async function submit() {
  const btn = $("submit");
  btn.disabled = true; btn.textContent = "提交中…";
  try {
    const body = {
      city: $("city").value, project: $("project").value, theme: $("theme").value,
      provider: $("provider").value, limit: Number($("limit").value),
      chain: $("chain").checked,
    };
    await api("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    poll();
  } catch (e) {
    $("log").textContent = "提交失败：" + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "提交任务";
  }
}

let polling = null;
function poll() {
  if (polling) return;
  polling = setInterval(async () => {
    const j = await api("/api/jobs");
    const items = j.items || [];
    if (items.length) {
      const job = items[0];
      $("log").textContent = job.log.join("\n") || "（等待输出…）";
      if (job.status !== "running") {
        clearInterval(polling); polling = null;
        await refresh();
      }
    }
  }, 1500);
}

$("submit").onclick = submit;
$("planBtn").onclick = showPlan;
(async () => { await loadMeta(); await refresh(); await showPlan(); })();
</script>
</body>
</html>
